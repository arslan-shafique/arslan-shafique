<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumbnail source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Authored at 1440x726 CSS px. Rendered at 3x -> 4320x2178.
     Regenerate with assets/social/render.ps1 */
  :root {
    --bg:       #070b16;
    --surface:  #0e1526;
    --line:     #1e293f;
    --text:     #e8edf7;
    --text-2:   #a3b0c7;
    --text-3:   #6f7e99;
    --accent:   #38bdf8;
    --accent-2: #818cf8;
    --grad: linear-gradient(115deg, #38bdf8 0%, #818cf8 52%, #c084fc 100%);
    --f-head: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1440px; height: 726px; overflow: hidden; }

  body {
    position: relative;
    background: var(--bg);
    font-family: var(--f-body);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ambient light */
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(760px 520px at 16% 6%,  rgba(56,189,248,.30), transparent 68%),
      radial-gradient(700px 560px at 78% 92%, rgba(129,140,248,.26), transparent 70%),
      radial-gradient(520px 420px at 95% 12%, rgba(192,132,252,.18), transparent 72%);
  }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#16203a 1px, transparent 1px),
      linear-gradient(90deg, #16203a 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse 78% 90% at 24% 40%, #000 12%, transparent 76%);
    mask-image: radial-gradient(ellipse 78% 90% at 24% 40%, #000 12%, transparent 76%);
    opacity: .75;
  }

  /* accent hairline top */
  .rule { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--grad); }

  .stage {
    position: relative;
    height: 100%;
    padding: 76px 96px 72px;
    display: flex; align-items: center; gap: 76px;
  }

  .copy { flex: 1 1 auto; min-width: 0; }

  .pill {
    display: inline-flex; align-items: center; gap: 13px;
    padding: 11px 26px 11px 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(14,21,38,.72);
    font-size: 21px; font-weight: 500; letter-spacing: .03em;
    color: var(--text-2);
  }
  .pill i { width: 11px; height: 11px; border-radius: 50%; background: #34d399; display: block; }

  h1 {
    margin: 30px 0 0;
    font-family: var(--f-head);
    font-size: 116px; font-weight: 700; line-height: .97;
    letter-spacing: -.035em;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .role {
    margin-top: 22px;
    font-family: var(--f-head);
    font-size: 43px; font-weight: 600; letter-spacing: -.015em;
    color: var(--text);
  }
  .role em { font-style: normal; color: var(--accent); }

  .chips { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
  .chips span {
    padding: 10px 20px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: rgba(19,28,49,.78);
    font-size: 21px; font-weight: 500; color: var(--text-2);
  }

  .url {
    margin-top: 44px;
    display: inline-flex; align-items: center; gap: 15px;
    font-family: var(--f-head);
    font-size: 30px; font-weight: 600; letter-spacing: -.01em;
    color: var(--text);
  }
  .url b {
    display: block; width: 34px; height: 3px; border-radius: 3px;
    background: var(--grad);
  }

  /* portrait */
  .shot { flex: 0 0 auto; position: relative; }
  .ring {
    position: relative;
    width: 400px; height: 400px; border-radius: 50%;
    padding: 7px;
    background: var(--grad);
    box-shadow: 0 46px 110px -30px rgba(56,189,248,.55);
  }
  .ring img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 7px solid var(--bg);
    background: var(--surface);
  }
  .badge {
    position: absolute; right: -8px; bottom: 22px;
    padding: 15px 26px;
    border-radius: 17px;
    background: rgba(14,21,38,.94);
    border: 1px solid var(--line);
    box-shadow: 0 26px 60px -22px rgba(0,0,0,.9);
    text-align: center;
  }
  .badge strong {
    display: block;
    font-family: var(--f-head); font-size: 27px; font-weight: 700;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .badge span { display: block; margin-top: 3px; font-size: 16px; color: var(--text-3); letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="rule"></div>

  <div class="stage">
    <div class="copy">
      <div class="pill"><i></i> Open to AI / ML roles</div>

      <h1>Arslan Shafique</h1>

      <p class="role">AI Engineer <em>·</em> LLMs, RAG &amp; AIoT</p>

      <div class="chips">
        <span>Python</span>
        <span>FastAPI</span>
        <span>PyTorch</span>
        <span>RAG</span>
        <span>Docker</span>
        <span>ESP32</span>
      </div>

      <div class="url"><b></b> arslan-shafique.vercel.app</div>
    </div>

    <div class="shot">
      <div class="ring">
        <img src="../img/arslan.jpg" alt="">
      </div>
      <div class="badge">
        <strong>Best FYP</strong>
        <span>IoT CATEGORY</span>
      </div>
    </div>
  </div>
</body>
</html>
